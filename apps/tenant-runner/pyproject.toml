[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pegasus-tenant-runner"
version = "0.1.0"
description = "Pegasus tenant runner — trusted shim that executes UNTRUSTED tenant workflow code in stripped-env subprocesses (Phase 3 Unit 8)."
readme = "README.md"
# Match the SDK's Python floor. The container image pins 3.12 explicitly so
# the runtime version is fully deterministic; the lower bound here keeps
# local-dev on Python 3.11 still workable.
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "DolasDev" }]
keywords = ["pegasus", "workflows", "temporal", "runner", "sandbox"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # Same lower bounds as apps/temporal-worker so a single resolution can
  # satisfy both apps and the SDK.
  "temporalio>=1.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["pegasus_tenant_runner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
