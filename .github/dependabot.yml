version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Tree-volatile dependencies, each on its own PR. These were carved out of
      # the catch-all after a 44-package grouped bump (#383, closed) wedged CI:
      # prisma 7.8.0 pulled @prisma/dev -> hono ^4.12.8, forking hono and
      # breaking the apps/api typecheck, while a cedar-wasm bump de-hoisted the
      # package out of root node_modules and broke the API Lambda bundle test.
      # Isolating them keeps a bump that reshuffles the install tree reviewable
      # and independently verifiable instead of buried in a 40-package PR.
      #
      # #665 was the same failure a second time: one 57-package minor-and-patch
      # PR carried three unrelated breakages. @temporalio/client 1.18->1.23 moved
      # to protobufjs ^8, which our own <8 override capped — 13 API test files
      # failed to import AND the API Lambda bundle silently stopped resolving
      # (the #594 INIT-crash shape). aws-cdk-lib/constructs made synth ~2.5x
      # slower and blew two test timeout budgets. vitest rode along in the same
      # PR. Each was independently diagnosable and none of them was reviewable
      # buried in 57 packages, so temporal, aws-cdk and vitest are carved out
      # here on the same reasoning as the three above.
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
        update-types:
          - 'minor'
          - 'patch'
      hono:
        patterns:
          - 'hono'
          - '@hono/*'
        update-types:
          - 'minor'
          - 'patch'
      cedar:
        patterns:
          - '@cedar-policy/*'
        update-types:
          - 'minor'
          - 'patch'
      temporal:
        patterns:
          - '@temporalio/*'
        update-types:
          - 'minor'
          - 'patch'
      # aws-cdk-lib, constructs and the aws-cdk CLI move in lockstep; a
      # mismatched pair is its own failure mode, so they share one group.
      aws-cdk:
        patterns:
          - 'aws-cdk-lib'
          - 'constructs'
          - 'aws-cdk'
        update-types:
          - 'minor'
          - 'patch'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'minor'
          - 'patch'
      minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - 'prisma'
          - '@prisma/*'
          - 'hono'
          - '@hono/*'
          - '@cedar-policy/*'
          - '@temporalio/*'
          - 'aws-cdk-lib'
          - 'constructs'
          - 'aws-cdk'
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Pinned to Expo SDK 55's expected versions. npm `overrides` only constrains
      # transitive deps, not workspace direct deps, so Dependabot would otherwise
      # silently bump these and break `expo install --check`. Bump these manually
      # in lockstep with Expo SDK upgrades, not via Dependabot.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-test-renderer'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-gesture-handler'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-screens'
      - dependency-name: '@react-navigation/drawer'
    target-branch: 'main'

  # GitHub Actions: 35+ action refs pinned by mutable major tag (e.g. @v6).
  # Dependabot watches the tags so the major-tag pinning posture stays current;
  # minor/patch bumps flow through the CI-gated auto-merge, majors need a human.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
    target-branch: 'main'

  # Python SDK published to PyPI for tenant use. No coverage before this.
  - package-ecosystem: 'pip'
    directory: '/packages/workflows-sdk-python'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
