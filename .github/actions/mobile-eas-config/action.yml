name: 'Mobile EAS config'
description: 'Node + deps (via ./.github/actions/setup), Pegasus runtime config resolved from SSM into apps/mobile/.env, and the EAS CLI installed.'

inputs:
  aws-role:
    description: 'OIDC role ARN to assume for SSM reads (the environment-scoped AWS_DEPLOY_ROLE_ARN).'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: us-east-1
        role-session-name: pegasus-mobile-${{ github.run_id }}

    - name: Resolve mobile config from SSM → apps/mobile/.env
      shell: bash
      # The same script developers run locally (npm run env:prod), so a local
      # .env is generated exactly the way a release build's is.
      run: bash apps/mobile/scripts/env-from-ssm.sh

    - name: Install EAS CLI
      shell: bash
      # Pin the major to match eas.json cli.version (>=21 <22) so an upstream
      # eas-cli major bump can't silently break builds mid-pipeline.
      run: npm install -g eas-cli@^21.0.0
