name: 'Mobile EAS config'
description: 'Node + deps (via ./.github/actions/setup), Pegasus runtime config resolved from SSM into apps/mobile/.env, and the EAS CLI installed.'

inputs:
  aws-role:
    description: 'OIDC role ARN to assume for SSM reads (the environment-scoped AWS_DEPLOY_ROLE_ARN).'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: us-east-1
        role-session-name: pegasus-mobile-${{ github.run_id }}

    - name: Resolve mobile config from SSM → apps/mobile/.env
      shell: bash
      run: |
        set -euo pipefail
        USER_POOL_ID=$(aws ssm get-parameter --name /pegasus/admin/cognito-user-pool-id --query Parameter.Value --output text)
        CLIENT_ID=$(aws ssm get-parameter --name /pegasus/mobile/cognito-client-id --query Parameter.Value --output text)
        HOSTED_UI=$(aws ssm get-parameter --name /pegasus/admin/cognito-hosted-ui-domain --query Parameter.Value --output text)
        API_DOMAIN=$(aws ssm get-parameter --name /dolas/pegasus/api/domain-name --query Parameter.Value --output text)
        # User pool + client IDs aren't strict secrets (they ship inside any
        # built app) but masking keeps the job log tidy.
        echo "::add-mask::$USER_POOL_ID"
        echo "::add-mask::$CLIENT_ID"
        cat > apps/mobile/.env <<ENVEOF
        # Generated by the mobile-eas-config action — do not commit
        EXPO_PUBLIC_API_URL=https://${API_DOMAIN}
        EXPO_PUBLIC_COGNITO_REGION=us-east-1
        EXPO_PUBLIC_COGNITO_USER_POOL_ID=${USER_POOL_ID}
        EXPO_PUBLIC_COGNITO_CLIENT_ID=${CLIENT_ID}
        EXPO_PUBLIC_COGNITO_DOMAIN=${HOSTED_UI}
        EXPO_PUBLIC_COGNITO_REDIRECT_URI=movingapp://auth/callback
        ENVEOF
        echo "Wrote apps/mobile/.env:"
        grep -E '^EXPO_PUBLIC_(API_URL|COGNITO_REGION|COGNITO_REDIRECT_URI)=' apps/mobile/.env

    - name: Install EAS CLI
      shell: bash
      run: npm install -g eas-cli
