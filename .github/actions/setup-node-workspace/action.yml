name: Setup node workspace
description: >
  Sets up Node.js (via .nvmrc), installs workspace dependencies with npm ci,
  fixes binary permissions, and optionally runs prisma generate. Used by the
  deploy and VPN-agent publish workflows to deduplicate the repeated setup block.

inputs:
  prisma-generate:
    description: 'Run prisma generate after npm ci (required by api-touching jobs)'
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Fix binary permissions
      run: find node_modules/.bin -type f | xargs chmod +x 2>/dev/null || true
      shell: bash

    - name: Generate Prisma client
      if: inputs.prisma-generate == 'true'
      working-directory: apps/api
      run: node ../../node_modules/.bin/prisma generate
      shell: bash
