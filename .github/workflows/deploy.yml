name: Deploy

# Canonical deploy path for Pegasus.
#
# - `push` to `main`: auto-deploys only the components whose source paths
#   changed (api, tenant-web, admin-web) since the last successfully
#   deployed SHA (`LAST_DEPLOY_SHA` repo variable — see the `changes` and
#   `record-deploy` jobs). Infra/workflow changes trigger a full `--all`
#   deploy. Staging deploys first, then prod (gated by the `prod` GitHub
#   environment's required-reviewer rule).
# - `workflow_dispatch`: manual run with a `target` input for forcing a
#   specific component. Same staging→prod flow.
#
# The actual deploy steps live in `_deploy.yml` (a reusable workflow) so
# the env-by-env chain stays linear and future gates (e.g. E2E tests
# against staging) can slot in between the calls without duplicating the
# CDK deploy logic.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to deploy'
        type: choice
        required: true
        default: all
        options:
          - all
          - api
          - tenant-web
          - admin-web

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Detect which components changed. On workflow_dispatch the `target` input
  # wins; on push we diff against the last *successfully deployed* SHA (the
  # `LAST_DEPLOY_SHA` repo variable, advanced by the `record-deploy` job)
  # rather than the previous commit. This makes queued-run cancellations
  # benign by construction: the surviving newest run always covers every
  # commit since the last green deploy, so cancelled-while-queued runs can
  # no longer silently drop code deploys.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh variable get LAST_DEPLOY_SHA
    outputs:
      api: ${{ steps.decide.outputs.api }}
      tenant_web: ${{ steps.decide.outputs.tenant_web }}
      admin_web: ${{ steps.decide.outputs.admin_web }}
      any: ${{ steps.decide.outputs.any }}
      migrations: ${{ steps.decide.outputs.migrations }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need history back to the last-deploy marker tag

      - name: Resolve diff base
        id: base
        run: |
          set -euo pipefail
          # Marker is the `last-deploy` tag (advanced by record-deploy).
          # GITHUB_TOKEN cannot write Actions variables (403 Resource not
          # accessible by integration — needs a fine-grained Variables PAT),
          # so the marker lives in git instead: contents:write suffices.
          BASE=$(git rev-parse 'refs/tags/last-deploy^{commit}' 2>/dev/null || true)
          # Fallbacks: missing tag (first run) or unresolvable commit →
          # empty base → deploy everything.
          if [[ -z "$BASE" ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "::warning::No usable last-deploy tag — forcing full deploy."
            fi
          else
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide components to deploy
        id: decide
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          # changed <path>... — true when any path differs between the diff
          # base and HEAD. An empty base means "no usable marker": treat
          # everything as changed. (`git diff --quiet` avoids a pipe to grep,
          # which could mis-report under pipefail via SIGPIPE.)
          changed() { [[ -z "$BASE" ]] || ! git diff --quiet "$BASE..HEAD" -- "$@"; }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              all)
                api=true; tenant=true; admin=true; migrations=true ;;
              api)
                api=true; tenant=false; admin=false; migrations=true ;;
              tenant-web)
                api=false; tenant=true; admin=false; migrations=false ;;
              admin-web)
                api=false; tenant=false; admin=true; migrations=false ;;
              *)
                echo "Unknown target: ${{ inputs.target }}"; exit 1 ;;
            esac
          else
            # push event — diff since last deploy; infra changes force --all.
            # Path lists are read from .github/deploy-manifest.json so there is
            # one source of truth for component→paths→stacks (Phase 3.2).
            MANIFEST=.github/deploy-manifest.json
            # Use // [] to null-safe iterate — an absent/null key returns empty
            # rather than a jq error; empty paths would silently diff the whole
            # tree via changed() so this also makes the failure mode explicit.
            mapfile -t FORCE_ALL < <(jq -r '.forceAllPaths // [] | .[]' "$MANIFEST")
            mapfile -t API_PATHS < <(jq -r '.components.api.paths // [] | .[]' "$MANIFEST")
            mapfile -t TENANT_PATHS < <(jq -r '.components["tenant-web"].paths // [] | .[]' "$MANIFEST")
            mapfile -t ADMIN_PATHS < <(jq -r '.components["admin-web"].paths // [] | .[]' "$MANIFEST")
            [[ ${#FORCE_ALL[@]} -gt 0 && ${#API_PATHS[@]} -gt 0 && ${#TENANT_PATHS[@]} -gt 0 && ${#ADMIN_PATHS[@]} -gt 0 ]] \
              || { echo "::error::deploy-manifest.json missing required path entries — check forceAllPaths and all component paths"; exit 1; }
            if changed "${FORCE_ALL[@]}"; then
              api=true; tenant=true; admin=true
            else
              changed "${API_PATHS[@]}" && api=true || api=false
              changed "${TENANT_PATHS[@]}" && tenant=true || tenant=false
              changed "${ADMIN_PATHS[@]}" && admin=true || admin=false
            fi
            migrations=$(changed apps/api/prisma/migrations && echo true || echo false)
          fi
          echo "api=${api}" >> "$GITHUB_OUTPUT"
          echo "tenant_web=${tenant}" >> "$GITHUB_OUTPUT"
          echo "admin_web=${admin}" >> "$GITHUB_OUTPUT"
          echo "migrations=${migrations}" >> "$GITHUB_OUTPUT"
          if [[ "$api" == "true" || "$tenant" == "true" || "$admin" == "true" ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Deploy plan"
            echo "Diff base: \`${BASE:-<none — full deploy>}\`"
            echo ""
            echo "| Component | Deploy |"
            echo "|---|---|"
            echo "| api | ${api} |"
            echo "| tenant-web | ${tenant} |"
            echo "| admin-web | ${admin} |"
            echo "| migrations | ${migrations} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Staging deploy. Runs on push to main and workflow_dispatch from main.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    needs: changes
    if: needs.changes.outputs.any == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      env-name: staging
      stack-prefix: PegasusStaging
      deploy-api: ${{ needs.changes.outputs.api }}
      deploy-tenant: ${{ needs.changes.outputs.tenant_web }}
      deploy-admin: ${{ needs.changes.outputs.admin_web }}
      skip-migrate: ${{ needs.changes.outputs.migrations == 'true' && 'false' || 'true' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # ---------------------------------------------------------------------------
  # E2E gate. After staging deploys, run the Playwright suite in remote mode
  # against the just-deployed staging URLs (extracted from the
  # `cdk-outputs-staging` artifact). Specs tagged `@local-only` (DB-seeded or
  # auth-required) are filtered out by `playwright.config.ts`. See
  # `apps/e2e/REMOTE.md` for the contract.
  #
  # The gate intentionally runs a small smoke (health + landing today) — its
  # job is to catch a broken deploy before prod, not to validate every flow.
  # If it fails, `deploy-prod` is skipped and the run is marked failed.
  # ---------------------------------------------------------------------------
  e2e-staging:
    name: E2E gate against staging
    needs: [changes, deploy-staging]
    if: needs.changes.outputs.any == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    permissions:
      id-token: write
      contents: read
    env:
      # Floor for the silent-skip guard below. ~10 tests run in remote mode
      # today; keep the floor deliberately loose. Bump when specs are added.
      E2E_MIN_EXECUTED_TESTS: '8'
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            node ../../node_modules/.bin/playwright install-deps chromium
          else
            node ../../node_modules/.bin/playwright install --with-deps chromium
          fi

      - name: Download CDK outputs
        uses: actions/download-artifact@v8
        with:
          name: cdk-outputs-staging
          path: /tmp

      - name: Extract staging URLs
        id: outs
        run: |
          set -euo pipefail
          F=/tmp/pegasus-cdk-outputs.json
          API_URL=$(jq -r '.["pegasus-staging-api"].ApiUrl // empty' "$F")
          WEB_URL=$(jq -r '.["pegasus-staging-frontend"].DistributionUrl // empty' "$F")
          USER_POOL_ID=$(jq -r '.["pegasus-staging-cognito"].UserPoolId // empty' "$F")
          CLIENT_ID=$(jq -r '.["pegasus-staging-cognito"].MobileClientId // empty' "$F")
          TENANT_CLIENT_ID=$(jq -r '.["pegasus-staging-cognito"].TenantClientId // empty' "$F")
          E2E_ROLE_ARN=$(jq -r '.["pegasus-staging-e2e-role"].E2ERoleArn // empty' "$F")
          # CLIENT_ID / TENANT_CLIENT_ID stay optional; everything else is
          # required by the remote suite — fail loud instead of letting
          # Playwright die on garbage env vars.
          for v in API_URL WEB_URL USER_POOL_ID E2E_ROLE_ARN; do
            [[ -n "${!v}" ]] || { echo "::error::$v missing from cdk-outputs-staging — output key renamed or stack not in deploy set?"; exit 1; }
          done
          for v in API_URL WEB_URL USER_POOL_ID CLIENT_ID TENANT_CLIENT_ID E2E_ROLE_ARN; do
            echo "$v=${!v}" >> "$GITHUB_OUTPUT"
          done

      # Persona-coverage tests in authz-smoke.spec.ts call AdminSetUserPassword
      # against the staging Cognito user pool. We assume a narrow, e2e-only
      # role provisioned by PegasusStaging-E2EStagingRoleStack — see
      # packages/infra/lib/stacks/e2e-staging-role-stack.ts.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.outs.outputs.E2E_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: pegasus-e2e-staging-${{ github.run_id }}

      - name: Run E2E (remote)
        working-directory: apps/e2e
        env:
          E2E_TARGET: remote
          E2E_API_BASE_URL: ${{ steps.outs.outputs.API_URL }}
          WEB_URL: ${{ steps.outs.outputs.WEB_URL }}
          E2E_COGNITO_USER_POOL_ID: ${{ steps.outs.outputs.USER_POOL_ID }}
          E2E_COGNITO_CLIENT_ID: ${{ steps.outs.outputs.CLIENT_ID }}
          E2E_COGNITO_TENANT_CLIENT_ID: ${{ steps.outs.outputs.TENANT_CLIENT_ID }}
          E2E_STAGING_ADMIN_USERNAME: ${{ vars.E2E_STAGING_ADMIN_USERNAME }}
          E2E_STAGING_ADMIN_PASSWORD: ${{ secrets.E2E_STAGING_ADMIN_PASSWORD }}
          E2E_STAGING_TENANT_ID: ${{ vars.E2E_STAGING_TENANT_ID }}
          AWS_REGION: us-east-1
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        # `html` is kept in the reporter list so the report artifact upload
        # below still has a playwright-report/ to ship.
        run: npx playwright test --reporter=list,html,json

      - name: Guard against silent-skip false positives
        working-directory: apps/e2e
        run: |
          ran=$(jq '.stats.expected + .stats.flaky' results.json)
          echo "Executed (passed) tests: $ran"
          if [ "$ran" -lt "$E2E_MIN_EXECUTED_TESTS" ]; then
            echo "::error::Only $ran tests executed — the suite silently skipped (missing env / over-filtering?). Floor is $E2E_MIN_EXECUTED_TESTS."
            exit 1
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-staging
          path: apps/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Prod deploy. Auto-runs after the staging E2E gate succeeds, but the `prod`
  # GitHub environment carries a required-reviewer rule, so the job pauses for
  # approval before the underlying deploy steps execute.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to prod
    needs: [changes, e2e-staging]
    if: needs.changes.outputs.any == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      env-name: prod
      stack-prefix: PegasusProd
      deploy-api: ${{ needs.changes.outputs.api }}
      deploy-tenant: ${{ needs.changes.outputs.tenant_web }}
      deploy-admin: ${{ needs.changes.outputs.admin_web }}
      skip-migrate: ${{ needs.changes.outputs.migrations == 'true' && 'false' || 'true' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # ---------------------------------------------------------------------------
  # Record the deployed SHA. Advances the LAST_DEPLOY_SHA repo variable that
  # the `changes` job diffs against. Only push runs and dispatch target=all
  # evaluated ALL components, so only they may advance the marker — a partial
  # dispatch (e.g. target=api) must not, or it would swallow undeployed
  # tenant/admin changes. A failed write here just leaves the older (more
  # conservative) base in place; it can never corrupt detection.
  # ---------------------------------------------------------------------------
  record-deploy:
    name: Record deployed SHA
    needs: [changes, deploy-prod]
    if: success() && (github.event_name == 'push' || inputs.target == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # force-push the last-deploy marker tag
    steps:
      - uses: actions/checkout@v6
      - name: Advance last-deploy tag
        run: |
          set -euo pipefail
          git tag -f last-deploy "${{ github.sha }}"
          git push -f origin refs/tags/last-deploy

  # ---------------------------------------------------------------------------
  # Record the last-known-good prod release as movable tags so rollback.yml can
  # resolve `prod-previous` with a blank `sha` input (two-click incident
  # recovery, zero `gh run list` spelunking). Unlike `last-deploy` (the
  # change-detection marker, advanced on every push) these track *prod*
  # releases only: `prod-current` = the SHA just deployed to prod,
  # `prod-previous` = the one before it. Runs on any successful prod deploy,
  # including a partial `target=api` dispatch — prod-current then tracks the
  # newest SHA actually pushed to prod, which is the right rollback target.
  # ---------------------------------------------------------------------------
  tag-release:
    name: Tag prod release
    needs: [changes, deploy-prod]
    if: success() && needs.changes.outputs.any == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # force-push the prod-current / prod-previous tags
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move prod-current / prod-previous tags
        run: |
          set -euo pipefail
          git fetch --tags --force
          prev=$(git rev-parse --verify -q prod-current^{commit} || true)
          if [[ -n "$prev" && "$prev" != "${{ github.sha }}" ]]; then
            git tag -f prod-previous "$prev"
            git push -f origin refs/tags/prod-previous
          fi
          git tag -f prod-current "${{ github.sha }}"
          git push -f origin refs/tags/prod-current
