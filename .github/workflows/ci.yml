name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Turbo remote cache (Vercel). Harmless while the secrets/variable are
  # unset — turbo silently runs with local cache only.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — docs/plans-only changes skip the heavy jobs below. Skipped
  # required checks report success, so branch protection stays satisfied.
  # secret-scan deliberately does NOT depend on this (docs can leak secrets).
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tenant_runner: ${{ steps.filter.outputs.tenant_runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # Single negated pattern: "code" = anything NOT under plans/ or
          # dolas/ and NOT a markdown file. Verified against picomatch 2.3.1
          # (dorny's pinned version, MatchOptions {dot: true}): extglob
          # !(a|b) does NOT span path segments, so the leading-! + brace form
          # is required. The extra `*.md` covers root-level files — `**/*.md`
          # inside a negated brace does not match the zero-segment case.
          filters: |
            code:
              - '!{plans/**,dolas/**,**/*.md,*.md}'
            # Python tests for the tenant runner (Phase 3 Unit 9) — only run
            # when the runner or its bundled SDK changes. The SDK is included
            # because tests import pegasus_workflows via tests/conftest.py;
            # ci.yml itself is included so changes to this job self-validate.
            tenant_runner:
              - 'apps/tenant-runner/**'
              - 'packages/workflows-sdk-python/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Secret scanning — runs first, fast, no deps
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Betterleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETTERLEAKS_VERSION: '1.1.1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cache Betterleaks
        id: bl-cache
        uses: actions/cache@v4
        with:
          path: ~/betterleaks-bin
          key: betterleaks-${{ env.BETTERLEAKS_VERSION }}-linux-x64
      - name: Install Betterleaks
        if: steps.bl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/betterleaks-bin
          curl -sSfL -o betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf betterleaks.tar.gz -C ~/betterleaks-bin betterleaks
          rm betterleaks.tar.gz
      - name: Run Betterleaks
        run: ~/betterleaks-bin/betterleaks git .

  # ---------------------------------------------------------------------------
  # Type-check
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Generate Prisma client
        working-directory: apps/api
        run: node ../../node_modules/.bin/prisma generate

      - name: Typecheck
        run: node node_modules/.bin/turbo run typecheck --continue

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # Dependency-security gate lives here (not in Test) so a new CVE fails
      # fast and independently of the Postgres container spin-up.
      - name: Audit dependencies
        run: npx --no-install audit-ci --config ./audit-ci.jsonc

      - name: Lint
        run: node node_modules/.bin/turbo run lint

  # ---------------------------------------------------------------------------
  # Tenant-runner Python tests (Phase 3 Unit 9) — pytest + ruff for
  # apps/tenant-runner, which is invisible to Turbo (no package.json). Plain
  # pip toolchain, mirroring release-sdk-python.yml (uv is the local-dev
  # convenience, not a CI dependency). The sandbox-isolation tests spawn real
  # subprocesses; they need no network, no Docker, no Temporal server.
  # ---------------------------------------------------------------------------
  tenant-runner-python:
    name: Tenant Runner (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.tenant_runner == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tenant-runner (+ dev extras)
        working-directory: apps/tenant-runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        working-directory: apps/tenant-runner
        run: python -m ruff check .

      - name: Pytest
        working-directory: apps/tenant-runner
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # Migration safety — enforce the expand-contract policy (PATTERNS.md):
  # newly-added migrations with destructive DDL must carry the explicit
  # `-- expand-contract: contract approved` marker. Cheap, deterministic; the
  # AI semantic review (rollback-plan 2c) slots in as a follow-up step here.
  # ---------------------------------------------------------------------------
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need origin/main / PR base to diff added migrations

      - name: Check expand-contract migration policy
        run: |
          set -euo pipefail
          base="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
          scripts/check-migration-safety.sh "$base"

  # ---------------------------------------------------------------------------
  # Unit + integration tests (Vitest across all packages)
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pegasus
          POSTGRES_PASSWORD: pegasus
          POSTGRES_DB: pegasus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pegasus -d pegasus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pegasus:pegasus@localhost:5432/pegasus?schema=public
      DIRECT_URL: postgresql://pegasus:pegasus@localhost:5432/pegasus?schema=public

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Initialise database schema and extensions
        run: |
          PGPASSWORD=pegasus psql -h localhost -U pegasus -d pegasus -c "CREATE SCHEMA IF NOT EXISTS platform;"
          PGPASSWORD=pegasus psql -h localhost -U pegasus -d pegasus -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Generate Prisma client
        working-directory: apps/api
        run: node ../../node_modules/.bin/prisma generate

      - name: Run Prisma migrations
        working-directory: apps/api
        run: node ../../node_modules/.bin/prisma migrate deploy

      - name: Check Expo SDK dependency compatibility
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Run Expo doctor
        working-directory: apps/mobile
        run: |
          # Tolerate the duplicate-dependency check (monorepo false positive:
          # mobile pins react@19.2.0 for Expo SDK 55 while web apps use 19.2.4).
          output=$(npx expo-doctor 2>&1) || true
          echo "$output"
          failures=$(echo "$output" | grep '✖' | grep -v 'duplicate dependencies' || true)
          if [ -n "$failures" ]; then
            echo "::error::Expo doctor found issues:"
            echo "$failures"
            exit 1
          fi

      - name: Run tests
        run: node node_modules/.bin/turbo run test

  # ---------------------------------------------------------------------------
  # E2E / acceptance tests (Playwright)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pegasus
          POSTGRES_PASSWORD: pegasus
          POSTGRES_DB: pegasus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pegasus -d pegasus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pegasus:pegasus@localhost:5432/pegasus?schema=public
      DIRECT_URL: postgresql://pegasus:pegasus@localhost:5432/pegasus?schema=public
      DEFAULT_TENANT_ID: e2e00000-0000-0000-0000-000000000001
      TEST_TENANT_ID: e2e00000-0000-0000-0000-000000000001
      SKIP_AUTH: 'true'
      CI: 'true'
      # Floor for the silent-skip guard below. 34 tests execute today (30 API
      # + 4 browser specs against the served tenant-web build). Floor 32 keeps
      # a little slack but still fires if the browser specs silently skip
      # (e.g. WEB_URL/serve step broken → back to 30). Bump when specs are
      # added/removed.
      E2E_MIN_EXECUTED_TESTS: '32'

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            node ../../node_modules/.bin/playwright install-deps chromium
          else
            node ../../node_modules/.bin/playwright install --with-deps chromium
          fi

      - name: Initialise database schema and extensions
        run: |
          PGPASSWORD=pegasus psql -h localhost -U pegasus -d pegasus -c "CREATE SCHEMA IF NOT EXISTS platform;"
          PGPASSWORD=pegasus psql -h localhost -U pegasus -d pegasus -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run Prisma migrations
        working-directory: apps/api
        run: node ../../node_modules/.bin/prisma migrate deploy

      - name: Generate Prisma client
        working-directory: apps/api
        run: node ../../node_modules/.bin/prisma generate

      # Domain ships dist/ via its package.json `main`; tsx-loaded API server
      # at runtime needs that dist to require('@pegasus/domain') to resolve.
      - name: Build @pegasus/domain
        run: node node_modules/.bin/turbo run build --filter=@pegasus/domain

      # Browser coverage (audit-e2e-strategy Phase 2): build tenant-web with
      # the e2e auth seam compiled in (`--mode e2e` — see
      # apps/tenant-web/src/auth/session.ts). Deliberately built with vite
      # directly, NOT via turbo, so the seam bundle can never be written to the
      # turbo remote cache that deploy builds read from. Workspace deps
      # (@pegasus/domain via vite alias, auth/api-http via src entry points)
      # need no prior builds.
      - name: Build tenant-web (e2e auth-seam mode)
        working-directory: apps/tenant-web
        run: node ../../node_modules/.bin/vite build --mode e2e

      # tenant-web reads /config.json at runtime; point it at the job's local
      # API. The cognito block is shape-valid dummy data — the seam never
      # initiates a Cognito flow and the API runs with SKIP_AUTH=true.
      - name: Point tenant-web config at the local API
        working-directory: apps/tenant-web
        run: |
          cat > dist/config.json <<'EOF'
          {
            "apiUrl": "http://localhost:3001",
            "cognito": {
              "region": "us-east-1",
              "userPoolId": "local-e2e",
              "clientId": "local-e2e",
              "domain": "https://e2e.invalid",
              "redirectUri": "http://localhost:4173/login/callback"
            }
          }
          EOF

      - name: Serve tenant-web build
        working-directory: apps/tenant-web
        run: |
          nohup node ../../node_modules/.bin/vite preview --port 4173 --strictPort </dev/null >/tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && exit 0
            sleep 1
          done
          echo "::error::vite preview did not become ready on :4173"
          cat /tmp/vite-preview.log
          exit 1

      # `html` is kept in the reporter list so the failure artifact upload
      # below still has a playwright-report/ to ship.
      - name: Run E2E tests
        working-directory: apps/e2e
        run: node ../../node_modules/.bin/playwright test --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          # Un-skips the browser specs (landing + core flows) against the
          # served e2e-mode tenant-web build above.
          WEB_URL: http://localhost:4173

      - name: Guard against silent-skip false positives
        working-directory: apps/e2e
        run: |
          ran=$(jq '.stats.expected + .stats.flaky' results.json)
          echo "Executed (passed) tests: $ran"
          if [ "$ran" -lt "$E2E_MIN_EXECUTED_TESTS" ]; then
            echo "::error::Only $ran tests executed — the suite silently skipped (E2E_SKIP / missing env?). Floor is $E2E_MIN_EXECUTED_TESTS."
            exit 1
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
