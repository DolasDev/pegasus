name: Mobile release

# Manual, no-wait release of the @pegasus/mobile driver app.
#
# Trigger — workflow_dispatch only. A mobile release is a deliberate act: the
# app bundles shared workspace packages, so auto-on-push would fire on unrelated
# backend merges, and EAS free-tier build queues routinely outlive a synchronous
# CI job. Dispatching the workflow IS the release gate.
#
# Model — `eas build --no-wait` (plus `--auto-submit` for a real release) hands
# the build, and the store submit, to EAS's servers and returns immediately. So
# CI confirms the build was *accepted*, not that it finished — watch progress
# and outcome at
#   https://expo.dev/accounts/dolas.dev/projects/moving-storage-driver/builds
# `--auto-submit` reads eas.json `submit.production.*`: Android → Play Closed
# testing (`alpha` track), iOS → TestFlight. Both store credentials (the Google
# service-account key, the App Store Connect API key) are EAS-hosted, so neither
# lives in this repo.
#
# Config — API URL + Cognito for the chosen environment are resolved from SSM
# into apps/mobile/.env by the ./.github/actions/mobile-eas-config composite,
# and the build runs on Node 24 (eas.json build profiles pin `node`, matching
# the repo's engines requirement — EAS's default Node 20 fails `npm ci`).
#
# iOS — pick the artifact with `ios_build`: `simulator` (unsigned, CI signal,
# needs no Apple credentials), `device` (signed ad-hoc .ipa for a REGISTERED
# device, registered via `eas device:create`), or `store` (signed .ipa for
# TestFlight/App Store). Both signed kinds draw on the Apple credentials held by
# EAS (distribution cert, provisioning profile, APNs key, App Store Connect API
# key) — set up once via `eas credentials --platform ios`.
# Only `store` can submit: `--auto-submit` resolves the submit profile by BUILD
# PROFILE NAME, and `store` maps to `production`, which pairs with eas.json
# `submit.production.ios`. A simulator or ad-hoc artifact is not submittable, so
# the `submit` toggle is ignored for them. See apps/mobile/PUSH_NOTIFICATIONS.md.

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Pegasus environment whose API/Cognito config to bake in'
        type: choice
        required: true
        default: prod
        options: [prod, staging]
      platform:
        description: 'Which platform(s) to build'
        type: choice
        required: true
        default: android
        options: [android, ios, all]
      submit:
        # Defaults ON, and applies per platform:
        #   Android — Google production access is granted and the first AAB is
        #     uploaded, so the Play Developer API accepts submits. Auto-submit
        #     targets the Closed testing (`alpha`) track (eas.json
        #     submit.production.android); a validated build is promoted to
        #     Production manually in the Play Console (staged rollout recommended).
        #   iOS — only when `ios_build=store`; lands the build in TestFlight via
        #     eas.json submit.production.ios. Release to the App Store is a
        #     deliberate act in App Store Connect, never automatic from here.
        # Untick for a build-only release.
        description: 'Auto-submit after the build (Android: Play Closed testing; iOS: TestFlight, store artifact only)'
        type: boolean
        required: false
        default: true
      ios_build:
        # What kind of iOS artifact to produce. Defaults to `simulator` — the
        # historical behavior, and the only one that needs no Apple credentials.
        #   simulator — unsigned .app, CI signal only. Cannot receive push (a
        #               simulator has no APNs device token).
        #   device    — signed ad-hoc .ipa installable on a REGISTERED device.
        #               This is the one that can test push. Requires at least one
        #               device registered (`eas device:create`) or the build fails.
        #   store     — signed .ipa for TestFlight / App Store, and the ONLY
        #               artifact that can auto-submit: with `submit` ticked it
        #               lands in TestFlight via eas.json submit.production.ios
        #               (#627). Releasing from TestFlight to the App Store stays
        #               a deliberate act in App Store Connect.
        description: 'iOS: which artifact to build'
        type: choice
        required: false
        default: simulator
        options: [simulator, device, store]

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  resolve:
    name: Resolve release parameters
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      do_android: ${{ steps.d.outputs.do_android }}
      do_ios: ${{ steps.d.outputs.do_ios }}
      do_android_submit: ${{ steps.d.outputs.do_android_submit }}
      do_ios_submit: ${{ steps.d.outputs.do_ios_submit }}
      ios_profile: ${{ steps.d.outputs.ios_profile }}
    steps:
      - name: Decide
        id: d
        run: |
          set -euo pipefail
          platform="${{ inputs.platform }}"
          do_android=false; do_ios=false
          [[ "$platform" == "all" || "$platform" == "android" ]] && do_android=true
          [[ "$platform" == "all" || "$platform" == "ios" ]] && do_ios=true
          # An Android build submits whenever the toggle is on.
          do_android_submit=false
          if [[ "$do_android" == "true" && "${{ inputs.submit }}" == "true" ]]; then
            do_android_submit=true
          fi
          # iOS artifact kind -> eas.json build profile. `device` and `store`
          # both need Apple signing credentials on EAS; `simulator` needs none.
          case "${{ inputs.ios_build }}" in
            device) ios_profile=ios-device ;;
            store)  ios_profile=production ;;
            *)      ios_profile=ios-simulator-ci ;;
          esac
          # iOS submits ONLY from the store artifact: a simulator .app has no
          # signature and an ad-hoc .ipa is provisioned for registered devices,
          # so neither is accepted by App Store Connect. Gate on the profile
          # rather than the input so this stays true if the mapping above moves.
          do_ios_submit=false
          if [[ "$do_ios" == "true" && "$ios_profile" == "production" && "${{ inputs.submit }}" == "true" ]]; then
            do_ios_submit=true
          fi
          {
            echo "do_android=$do_android"
            echo "do_ios=$do_ios"
            echo "do_android_submit=$do_android_submit"
            echo "do_ios_submit=$do_ios_submit"
            echo "ios_profile=$ios_profile"
          } >> "$GITHUB_OUTPUT"
          echo "android=$do_android (submit=$do_android_submit) ios=$do_ios (profile=$ios_profile submit=$do_ios_submit) env=${{ inputs.env }}"

  # ---------------------------------------------------------------------------
  # Android — trigger a production AAB build on EAS and (optionally) auto-submit
  # to the Closed testing track when it finishes. --no-wait returns immediately;
  # the build + submit run server-side.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (production AAB) → EAS
    needs: resolve
    if: needs.resolve.outputs.do_android == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mobile-eas-config
        with:
          aws-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: EAS build (Android, production, no-wait)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          submit_flag=""
          if [[ "${{ needs.resolve.outputs.do_android_submit }}" == "true" ]]; then
            submit_flag="--auto-submit"
          fi
          eas build --non-interactive --no-wait --profile production --platform android $submit_flag
          echo "Build queued on EAS. Track progress: https://expo.dev/accounts/dolas.dev/projects/moving-storage-driver/builds"

  # ---------------------------------------------------------------------------
  # iOS build — profile chosen by the `ios_build` input (see its comment above).
  # --no-wait, like Android: EAS builds server-side and CI confirms acceptance.
  #
  # `device` and `store` build against the `production` EAS environment (both
  # profiles extend `production`), NOT `preview` — the production env vars are
  # the ones verified correct in #541; the preview set is still suspect. That
  # matters more than it looks: EAS's stored env vars OVERRIDE the .env the
  # mobile-eas-config composite writes, so the profile is what decides which API
  # a build actually talks to.
  #
  # `--auto-submit` is added only for the `store` artifact (see the resolve job).
  # It lands the build in TestFlight; releasing to the App Store from there stays
  # a manual act in App Store Connect.
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (${{ inputs.ios_build }}) → EAS
    needs: resolve
    if: needs.resolve.outputs.do_ios == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mobile-eas-config
        with:
          aws-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: EAS build (iOS, no-wait)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          IOS_PROFILE: ${{ needs.resolve.outputs.ios_profile }}
        run: |
          set -euo pipefail
          submit_flag=""
          if [[ "${{ needs.resolve.outputs.do_ios_submit }}" == "true" ]]; then
            submit_flag="--auto-submit"
          fi
          echo "iOS artifact: ${{ inputs.ios_build }} (eas profile: $IOS_PROFILE, submit: ${{ needs.resolve.outputs.do_ios_submit }})"
          eas build --non-interactive --no-wait --profile "$IOS_PROFILE" --platform ios $submit_flag
          echo "Build queued on EAS. Track progress: https://expo.dev/accounts/dolas.dev/projects/moving-storage-driver/builds"
