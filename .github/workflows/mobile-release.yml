name: Mobile release

# Manual, no-wait release of the @pegasus/mobile driver app.
#
# Trigger — workflow_dispatch only. A mobile release is a deliberate act: the
# app bundles shared workspace packages, so auto-on-push would fire on unrelated
# backend merges, and EAS free-tier build queues routinely outlive a synchronous
# CI job. Dispatching the workflow IS the release gate.
#
# Model — `eas build --no-wait` (plus `--auto-submit` for a real Android
# release) hands the build, and the Google Play submit, to EAS's servers and
# returns immediately. So CI confirms the build was *accepted*, not that it
# finished — watch progress and outcome at
#   https://expo.dev/accounts/dolas.dev/projects/moving-storage-driver/builds
# Android `--auto-submit` uses eas.json `submit.production.android`
# (Closed testing / `alpha` track; the Google service-account key is EAS-hosted).
#
# Config — API URL + Cognito for the chosen environment are resolved from SSM
# into apps/mobile/.env by the ./.github/actions/mobile-eas-config composite,
# and the build runs on Node 24 (eas.json build profiles pin `node`, matching
# the repo's engines requirement — EAS's default Node 20 fails `npm ci`).
#
# iOS — an unsigned simulator build, on-demand signal only (deferred platform:
# no Apple Developer credentials → no device build, no App Store submit).

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Pegasus environment whose API/Cognito config to bake in'
        type: choice
        required: true
        default: prod
        options: [prod, staging]
      platform:
        description: 'Which platform(s) to build'
        type: choice
        required: true
        default: android
        options: [android, ios, all]
      submit:
        # Defaults ON: Google production access is granted and the first AAB is
        # uploaded, so the Play Developer API accepts submits. Auto-submit targets
        # the Closed testing (`alpha`) track (eas.json submit.production.android);
        # a validated build is promoted to Production manually in the Play Console
        # (staged rollout recommended). Untick for a build-only release.
        description: 'Android: auto-submit to Google Play (Closed testing) after the build'
        type: boolean
        required: false
        default: true

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  resolve:
    name: Resolve release parameters
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      do_android: ${{ steps.d.outputs.do_android }}
      do_ios: ${{ steps.d.outputs.do_ios }}
      do_submit: ${{ steps.d.outputs.do_submit }}
    steps:
      - name: Decide
        id: d
        run: |
          set -euo pipefail
          platform="${{ inputs.platform }}"
          do_android=false; do_ios=false
          [[ "$platform" == "all" || "$platform" == "android" ]] && do_android=true
          [[ "$platform" == "all" || "$platform" == "ios" ]] && do_ios=true
          # Only an Android build submits, and only when the toggle is on.
          do_submit=false
          if [[ "$do_android" == "true" && "${{ inputs.submit }}" == "true" ]]; then
            do_submit=true
          fi
          {
            echo "do_android=$do_android"
            echo "do_ios=$do_ios"
            echo "do_submit=$do_submit"
          } >> "$GITHUB_OUTPUT"
          echo "android=$do_android ios=$do_ios submit=$do_submit env=${{ inputs.env }}"

  # ---------------------------------------------------------------------------
  # Android — trigger a production AAB build on EAS and (optionally) auto-submit
  # to the Closed testing track when it finishes. --no-wait returns immediately;
  # the build + submit run server-side.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (production AAB) → EAS
    needs: resolve
    if: needs.resolve.outputs.do_android == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/mobile-eas-config
        with:
          aws-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: EAS build (Android, production, no-wait)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          submit_flag=""
          if [[ "${{ needs.resolve.outputs.do_submit }}" == "true" ]]; then
            submit_flag="--auto-submit"
          fi
          eas build --non-interactive --no-wait --profile production --platform android $submit_flag
          echo "Build queued on EAS. Track progress: https://expo.dev/accounts/dolas.dev/projects/moving-storage-driver/builds"

  # ---------------------------------------------------------------------------
  # iOS simulator (unsigned) build — on-demand CI signal only. --no-wait.
  # ---------------------------------------------------------------------------
  build-ios-simulator:
    name: Build iOS (simulator, unsigned) → EAS
    needs: resolve
    if: needs.resolve.outputs.do_ios == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/mobile-eas-config
        with:
          aws-role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - name: EAS build (iOS simulator, no-wait)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --non-interactive --no-wait --profile ios-simulator-ci --platform ios
          echo "Build queued on EAS. Track progress: https://expo.dev/accounts/dolas.dev/projects/moving-storage-driver/builds"
