name: _deploy

# Reusable deploy workflow. Called by `deploy.yml` once per env (staging, prod).
# Encapsulates the CDK deploy steps so the orchestrator can chain envs and
# slot future gates (e.g. E2E tests against staging) between the calls
# without duplicating the deploy logic.

on:
  workflow_call:
    inputs:
      env-name:
        description: 'Target env: staging or prod'
        type: string
        required: true
      stack-prefix:
        description: 'Construct ID prefix, e.g. PegasusStaging or PegasusProd'
        type: string
        required: true
      deploy-api:
        description: 'true if api/domain stacks should be deployed'
        type: string
        required: true
      deploy-tenant:
        description: 'true if tenant-web stacks should be deployed'
        type: string
        required: true
      deploy-admin:
        description: 'true if admin-web stacks should be deployed'
        type: string
        required: true
      aws-region:
        description: 'AWS region (defaults to us-east-1)'
        type: string
        default: us-east-1
      git-ref:
        description: 'Commit SHA/ref to check out and deploy (empty = workflow ref)'
        type: string
        default: ''
      skip-migrate:
        description: 'true to skip the prisma migrate job (rollbacks are code-only)'
        type: string
        default: 'false'

permissions:
  id-token: write
  contents: read

# Required env secrets per `environment`:
#   - DIRECT_URL — Neon **direct** (non-pooled) connection string with
#     `sslmode=require`. Consumed by `prisma migrate deploy` in the
#     `migrate` job below; the pooler can't host advisory locks or the
#     multi-statement transactions migrations need.
#   - DATABASE_URL — Neon pooled connection string with `sslmode=require`.
#     Used by the Lambda runtime; not read by the `migrate` job.
# Required env vars per `environment`:
#   - AWS_DEPLOY_ROLE_ARN — OIDC role assumed by the `deploy` job.

jobs:
  migrate:
    name: Migrate ${{ inputs.env-name }} database
    if: inputs.deploy-api == 'true' && inputs.skip-migrate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.env-name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git-ref }}

      - uses: ./.github/actions/setup

      - name: Generate Prisma client
        working-directory: apps/api
        run: node ../../node_modules/.bin/prisma generate

      - name: Show pending migrations
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          {
            echo "### Pending migrations (${{ inputs.env-name }})"
            echo ''
            echo '```'
            node ../../node_modules/.bin/prisma migrate status || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node ../../node_modules/.bin/prisma migrate deploy

  deploy:
    name: Deploy to ${{ inputs.env-name }}
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.env-name }}
    env:
      AWS_REGION: ${{ inputs.aws-region }}
      ENV_NAME: ${{ inputs.env-name }}
      STACK_PREFIX: ${{ inputs.stack-prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git-ref }}

      - uses: ./.github/actions/setup

      - name: Generate Prisma client
        working-directory: apps/api
        run: node ../../node_modules/.bin/prisma generate

      # ---------------------------------------------------------------------
      # Build workspace assets via Turbo so transitive `^build` dependencies
      # are produced topologically.
      #
      # Why Turbo (and not `npm run build --workspace=…`):
      #   `@pegasus/domain` exposes `main: ./dist/index.js` (required by the
      #   on-prem Windows Service path). CDK's NodejsFunction esbuild bundles
      #   `apps/api/src/lambda-document-converter.ts`, which transitively
      #   imports `@pegasus/domain`. Without dist on disk, esbuild fails with
      #   `Could not resolve "@pegasus/domain"`. The `npm run build --workspace`
      #   form does not honor Turbo's `^build` topology, so domain was never
      #   built before the bundle ran.
      #
      # Filters per component:
      #   - api:       `@pegasus/api^...` builds api's deps (domain) but not
      #                api itself — CDK still bundles api via esbuild.
      #   - tenant:    `@pegasus/tenant-web` builds tenant-web + transitive
      #                workspace deps.
      #   - admin:     `@pegasus/admin-web` builds admin-web + transitive
      #                workspace deps.
      # ---------------------------------------------------------------------
      - name: Build workspace assets (Turbo)
        env:
          DEPLOY_API: ${{ inputs.deploy-api }}
          DEPLOY_TENANT: ${{ inputs.deploy-tenant }}
          DEPLOY_ADMIN: ${{ inputs.deploy-admin }}
          # Turbo remote cache (Vercel); secrets arrive via the caller's
          # `secrets: inherit`. Harmless while unset — local cache only.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: |
          set -euo pipefail
          filters=()
          if [[ "$DEPLOY_API" == "true" ]]; then
            filters+=(--filter=@pegasus/api^...)
          fi
          if [[ "$DEPLOY_TENANT" == "true" ]]; then
            filters+=(--filter=@pegasus/tenant-web)
          fi
          if [[ "$DEPLOY_ADMIN" == "true" ]]; then
            filters+=(--filter=@pegasus/admin-web)
          fi
          if [[ ${#filters[@]} -eq 0 ]]; then
            echo "No deploy targets selected — skipping build."
            exit 0
          fi
          npx turbo run build "${filters[@]}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pegasus-deploy-${{ inputs.env-name }}-${{ github.run_id }}

      # The complete Temporal/broker secret ARNs (with the 6-char random
      # suffix) are hardcoded in packages/infra/bin/app.ts (see the
      # TEMPORAL_SECRET_ARNS comment there for why). If a secret is ever
      # rotated-by-recreation the suffix goes stale and the CFN update fails
      # minutes in with an opaque ECS error — so validate each ARN up front.
      # Filtering by the caller account ID naturally selects this env's ARNs.
      - name: Pre-flight Temporal secret ARNs
        if: inputs.deploy-api == 'true'
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          mapfile -t ARNS < <(grep -oE "arn:aws:secretsmanager:[^'\"]*" packages/infra/bin/app.ts \
            | { grep ":${ACCOUNT}:" || true; } | sort -u)
          if [[ ${#ARNS[@]} -eq 0 ]]; then
            echo "::error::No secretsmanager ARNs for account ${ACCOUNT} found in packages/infra/bin/app.ts — did TEMPORAL_SECRET_ARNS move? Update this pre-flight."
            exit 1
          fi
          for arn in "${ARNS[@]}"; do
            # Fail ONLY on an explicit ResourceNotFoundException (genuinely
            # stale ARN). Anything else — AccessDenied (IAM grant pending),
            # endpoint connectivity, throttling — is warn-and-continue: an
            # advisory pre-flight must never block a deploy on transient
            # noise (a prod deploy was lost to an 18-min endpoint hang).
            if err=$(AWS_MAX_ATTEMPTS=2 aws secretsmanager describe-secret --secret-id "$arn" \
                --cli-connect-timeout 10 --cli-read-timeout 15 \
                --query Name --output text 2>&1 >/dev/null); then
              echo "OK: $arn"
            elif grep -q 'ResourceNotFoundException' <<<"$err"; then
              echo "$err"
              echo "::error::Secret ARN stale (rotated-by-recreation?): $arn — update TEMPORAL_SECRET_ARNS in packages/infra/bin/app.ts"
              exit 1
            else
              echo "$err"
              echo "::warning::Cannot verify $arn (non-NotFound error above) — skipping. Grant secretsmanager:DescribeSecret on pegasus/* to the deploy role to arm this pre-flight."
            fi
          done

      - name: Resolve CDK stack target
        id: target
        env:
          API: ${{ inputs.deploy-api }}
          TENANT: ${{ inputs.deploy-tenant }}
          ADMIN: ${{ inputs.deploy-admin }}
          ENV_NAME: ${{ inputs.env-name }}
        run: |
          set -euo pipefail
          if [[ "$API" == "true" && "$TENANT" == "true" && "$ADMIN" == "true" ]]; then
            target="--all"
          else
            # Stack lists are driven by .github/deploy-manifest.json (Phase 3.3)
            # so component→stack mapping has one source of truth.
            MANIFEST=.github/deploy-manifest.json
            stacks=()
            add_stacks() {
              while read -r s; do
                stacks+=("${STACK_PREFIX}-${s}")
              done < <(jq -r ".components[\"$1\"].stacks // [] | .[]" "$MANIFEST")
            }
            [[ "$API"    == "true" ]] && add_stacks api
            # TemporalWorkerStack: Phase 2 Unit 4 added the Fargate worker
            # plane in the WireGuard VPC. It's logically an api-side concern
            # — the API Lambda starts workflows that the worker executes —
            # so it deploys with the api bucket. Synth is a no-op for dev
            # (the stack only instantiates for staging/prod), so the dev
            # path is unaffected.
            [[ "$TENANT" == "true" ]] && add_stacks tenant-web
            [[ "$ADMIN"  == "true" ]] && add_stacks admin-web
            # The staging-only E2E role stack is read by the post-deploy
            # gate via the cdk-outputs artifact. `cdk deploy <subset>` only
            # writes outputs for the named stacks, so include it on every
            # partial staging deploy or the gate fails with an empty
            # E2E_ROLE_ARN.
            while read -r s; do
              stacks+=("${STACK_PREFIX}-${s}")
            done < <(jq -r ".envExtraStacks[\"$ENV_NAME\"] // [] | .[]" "$MANIFEST")
            target="${stacks[*]}"
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "CDK target: ${target}"

      - name: CDK deploy
        working-directory: packages/infra
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: npm run deploy:ci

      - name: Summarize outputs
        if: success()
        run: |
          set -euo pipefail
          OUTPUTS_FILE=/tmp/pegasus-cdk-outputs.json
          if [[ ! -f "$OUTPUTS_FILE" ]]; then
            echo "No outputs file — skipping summary."
            exit 0
          fi

          STACK_NAME_PREFIX="pegasus-${ENV_NAME}"
          WEB_URL=$(jq -r ".[\"${STACK_NAME_PREFIX}-frontend\"].DistributionUrl // empty" "$OUTPUTS_FILE")
          ADMIN_URL=$(jq -r ".[\"${STACK_NAME_PREFIX}-admin-frontend\"].AdminDistributionUrl // empty" "$OUTPUTS_FILE")
          API_URL=$(jq -r ".[\"${STACK_NAME_PREFIX}-api\"].ApiUrl // empty" "$OUTPUTS_FILE")

          {
            echo "### Deployed URLs (${ENV_NAME})"
            [[ -n "$WEB_URL" ]]   && echo "- Client app: $WEB_URL"
            [[ -n "$ADMIN_URL" ]] && echo "- Admin portal: $ADMIN_URL"
            [[ -n "$API_URL" ]]   && echo "- API: $API_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CDK outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cdk-outputs-${{ inputs.env-name }}
          path: /tmp/pegasus-cdk-outputs.json
          if-no-files-found: ignore
          retention-days: 14
