name: Temporal worker image

# Builds + pushes the Pegasus Temporal worker container image (Phase 2 Unit 5)
# to the per-env ECR repositories created by TemporalWorkerStack, then forces
# a Fargate redeploy so the running tasks pick up the new image.
#
# Why a separate workflow (pattern A) instead of folding into deploy.yml:
#   - The image build is Python-only and doesn't share any of the JS/TS
#     build pipeline with the existing deploys (no npm ci, no turbo build).
#   - Triggering only on `apps/temporal-worker/**` (+ bundled SDK/stdlib)
#     means tenant-web/admin-web pushes don't pay any of this cost.
#   - The infra change that bumped `desiredCount` to 1 already triggers
#     `deploy.yml` (infra path filter), so the CDK stack rolls itself. This
#     workflow's job is just the image — separation of concerns matches the
#     mobile-build.yml / publish-stdlib.yml precedent.
#
# ── OPERATOR PREREQUISITE (one-time, before the first run) ─────────────────
# The OIDC role `AWS_DEPLOY_ROLE_ARN` per env environment needs ECR
# push perms on `arn:aws:ecr:us-east-1:*:repository/pegasus-temporal-worker`
# plus `ecs:UpdateService` + `ecs:DescribeServices` on the
# `pegasus-temporal-worker-<env>` service. The role pre-existed Phase 2
# Unit 4 and was set up out-of-band (see `e2e-staging-role-stack.ts` —
# it carries the same OIDC trust pattern as the deploy role). Granting
# these actions is a manual operator step; see the PR body of the Unit 5
# merge for the IAM policy snippet to attach.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - 'apps/temporal-worker/**'
      - 'packages/workflows-sdk-python/**'
      - 'packages/workflows-stdlib/**'
      - '.github/workflows/temporal-worker.yml'
      - '.github/workflows/_temporal-worker.yml'
  workflow_dispatch:
    inputs:
      env-name:
        description: 'Target env (defaults to both)'
        type: choice
        required: true
        default: both
        options:
          - both
          - staging
          - prod
      rollback-to-sha:
        description: 'Roll back: retag this already-pushed :<sha> image as :latest (no rebuild). Empty = normal build+push.'
        type: string
        default: ''

concurrency:
  group: temporal-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-build gate. Until this existed the image built and pushed to staging AND
  # prod ECR with no test or lint step — apps/temporal-worker appeared in no
  # workflow at all (audit-python-toolchain.md Phase 1.2). ci.yml runs the same
  # ruff+pytest on PRs; this re-runs it on the push so a build triggered by a
  # path CI didn't gate (or a manual dispatch) still can't ship untested code.
  #
  # Cheap and hermetic: ~30 tests in well under a second, no Temporal server
  # (temporalio's sdk-core bridge embeds the dev server), no Docker, no network.
  #
  # Deliberately NOT run for rollbacks: a rollback retags an already-pushed,
  # previously-tested image, and you are often rolling back *because* main is
  # broken — gating that on a green test suite would block the recovery path.
  test:
    name: Test (ruff + pytest)
    # Explicit push branch rather than relying on `inputs` being null outside a
    # workflow_dispatch: a push must always be tested, and only a dispatched
    # rollback opts out.
    if: ${{ github.event_name == 'push' || !inputs.rollback-to-sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install temporal-worker (+ dev extras)
        working-directory: apps/temporal-worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        working-directory: apps/temporal-worker
        run: python -m ruff check .

      - name: Pytest
        working-directory: apps/temporal-worker
        run: python -m pytest -q

  staging:
    name: staging
    needs: [test]
    # always() so a rollback run (where `test` is skipped by its own if:) still
    # reaches this job; the explicit success-or-skipped check is what actually
    # gates it, so a FAILED test blocks the push.
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.event_name == 'push' || inputs.env-name == 'both' || inputs.env-name == 'staging')
    uses: ./.github/workflows/_temporal-worker.yml
    with:
      env-name: staging
      rollback-to-sha: ${{ inputs.rollback-to-sha || '' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  prod:
    name: prod
    # always() is required so the if: condition is evaluated even when staging was skipped
    # (which happens on a workflow_dispatch with env-name=prod — staging's if: is false →
    # staging is SKIPPED → without always(), GitHub would cascade-skip prod too).
    #
    # prod MUST re-check `test` itself, not lean on staging. staging is skipped
    # (not failed) when the test job fails, and this job treats a skipped
    # staging as passable — so gating only staging would leave prod wide open on
    # exactly the failure this gate exists to catch.
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.event_name == 'push' || inputs.env-name == 'both' || inputs.env-name == 'prod') && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    needs: [test, staging]
    uses: ./.github/workflows/_temporal-worker.yml
    with:
      env-name: prod
      rollback-to-sha: ${{ inputs.rollback-to-sha || '' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
