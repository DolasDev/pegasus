name: Dependabot Auto-Merge

# Two halves, deliberately split:
#
#   auto-merge  (on: pull_request)      — the POLICY gate. Decides, via Dependabot
#                                         metadata, whether a PR is a semver
#                                         minor/patch bump we are willing to merge
#                                         unattended, and records that decision by
#                                         enabling auto-merge.
#   enqueue     (on: workflow_run [CI])  — makes that decision EFFECTIVE.
#
# Why the second half exists: `main` is governed by the `merge-queue-main` ruleset.
# Once a merge queue governs a branch, an auto-merge request created while the PR
# is still red is never re-evaluated when the PR later goes green — so the PR sits
# CLEAN forever and never enters the queue. The policy job always runs seconds
# after the PR opens (i.e. always while red), so under the queue it was a no-op:
# no Dependabot PR auto-merged between 2026-06-15 (ruleset created) and 2026-08-13.
#
# Re-issuing `gh pr merge --auto` on an already-enabled PR does NOT refresh the
# stale request. Only --disable-auto followed by --auto creates a fresh one, which
# is then evaluated immediately and enters the queue. That pair is what `enqueue`
# runs, once CI is actually green.
#
# A THIRD structural fact, independent of the two halves above: WHICH IDENTITY
# the `enqueue` job acts as decides whether the queue entry it creates ever gets
# built. GITHUB_TOKEN does not trigger workflows, so an enqueue made with it
# yields an entry and no `merge_group` run — the PR holds the head of the queue
# until the 60-minute timeout drops it. `enqueue` therefore prefers a GitHub App
# installation token, and says in its log which identity it ended up with.
#
# NOTE: `autoMergeRequest.mergeMethod` reads `MERGE` here even though the queue
# requires SQUASH. That is cosmetic — the queue's method wins — and is NOT a bug
# worth chasing.

on:
  pull_request:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to re-assert auto-merge on (manual unstick lever)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Policy gate. Unchanged in behavior: enabling auto-merge here is what marks a
  # PR as "approved to merge unattended". `enqueue` below reads that mark rather
  # than re-deriving the metadata.
  # ---------------------------------------------------------------------------
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # `--squash` is not passed. The merge queue dictates the strategy anyway
      # (SQUASH, from the `merge-queue-main` ruleset), so the flag bought nothing
      # and cost a misleading line of output: gh answers
      #
      #     ! The merge strategy for main is set by the merge queue
      #
      # and exits 0. Auto-merge IS still enabled — that warning is noise, not a
      # refusal. If the queue is ever removed, re-add the flag then.
      #
      # THAT NOISE IS NOT HARMLESS: on 2026-10-13 it was read as a refusal, and
      # the conclusion drawn was that this gate had been approving nothing. It was
      # wrong. The gate works; what actually fails is the GITHUB_TOKEN enqueue
      # downstream (see `enqueue`). Dropping the flag removes the bait.
      #
      # The verification below is the real content of this step, and it exists
      # because of that same mistake. "The step exited 0" and "this PR is now
      # marked approved" are independent claims — but so are the two ways a mark
      # can show up, and reading only ONE of them is what caused the misdiagnosis:
      # auto-merge CONVERTS INTO A QUEUE ENTRY and clears `autoMergeRequest`, so a
      # PR that is already queued legitimately reads null. `autoMergeRequest: null`
      # alone therefore proves nothing. Log BOTH signals, always, so the next
      # reader cannot repeat it.
      # -----------------------------------------------------------------------
      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh pr merge --auto "$PR_URL"

          # --- Record the outcome, with BOTH signals -------------------------
          # Not a bug fix — an observability fix. Nothing used to print whether
          # the mark landed, so the only way to find out was to query the PR
          # later, by which time a queued PR reads `autoMergeRequest: null` and
          # looks exactly like a PR that was never approved. That ambiguity cost
          # a wrong diagnosis on 2026-10-13. Both signals, in the log, every run.
          read -r HAS_AUTO IN_QUEUE <<<"$(
            gh api graphql -f query='query($owner:String!,$repo:String!,$pr:Int!){
              repository(owner:$owner,name:$repo){
                pullRequest(number:$pr){ autoMergeRequest{mergeMethod} isInMergeQueue }
              }
            }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$PR_NUMBER" \
              --jq '.data.repository.pullRequest
                    | [(.autoMergeRequest != null), .isInMergeQueue] | @tsv'
          )"
          echo "PR #$PR_NUMBER autoMergeRequest=$HAS_AUTO isInMergeQueue=$IN_QUEUE"

          if [[ "$HAS_AUTO" != "true" && "$IN_QUEUE" != "true" ]]; then
            echo "::warning::Policy approved PR #$PR_NUMBER but NEITHER an auto-merge request nor \
          a queue entry exists afterwards. \`enqueue\` will refuse this PR with 'policy did not \
          approve it' and it will never merge unattended. Read the gh output above for a refusal \
          line. Note this has never actually been observed — as of 2026-10-13 the gate works, and \
          the real failure is the GITHUB_TOKEN enqueue downstream."
          fi

          # A WARNING, NOT A FAILURE. The condition has never been observed, so
          # failing on it would be guessing at a failure mode rather than guarding
          # a known one — and a false red here would block every Dependabot PR for
          # something nobody can fix from CI. Revisit only if the warning ever
          # actually fires; at that point it will come with the gh output that
          # explains why, which is the whole point of printing both signals.

  # ---------------------------------------------------------------------------
  # Re-assert the (now stale) auto-merge request once CI has actually passed, so
  # the PR enters the merge queue.
  #
  # The workflow_run guard below filters to CI runs that came from a pull_request
  # event and succeeded. That excludes merge_group and push-to-main CI runs, and
  # is what stops this job from re-triggering off its own downstream activity.
  #
  # SECURITY: this job runs in default-branch context with write permissions. It
  # must NEVER check out PR head code — it only reads PR metadata and toggles
  # auto-merge.
  # ---------------------------------------------------------------------------
  enqueue:
    name: enqueue
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    steps:
      # -----------------------------------------------------------------------
      # Mint a GitHub App installation token.
      #
      # WHY AT ALL: actions taken with GITHUB_TOKEN do not trigger workflows, so
      # an enqueue made with it produces a queue entry and NO `merge_group` run.
      # The entry then holds the head of an ALLGREEN queue until it is dropped at
      # `check_response_timeout_minutes: 60`, blocking every other stream.
      # Reproduced eight times (#645, #656, #387, #657, #709, #710, #762, #799);
      # the two measured ones sat 18 and 21 minutes, then produced a group run in
      # ~28s and ~5s once re-enqueued under a non-GITHUB_TOKEN identity.
      # A GitHub App installation token is NOT GITHUB_TOKEN and does trigger
      # workflows, which is the entire point of this step.
      #
      # WHY A VAR GATES IT: `vars` is available in a step-level `if:`; a bare
      # `secrets` reference there is not reliable. The Client ID is not sensitive,
      # so it is the natural gate. When the var is unset the step is SKIPPED, a
      # skipped step's outputs are empty strings, and the `||` chain below falls
      # through — which is what makes this safe to merge BEFORE the App exists.
      #
      # `app-id` is DEPRECATED in v3 in favour of `client-id`. The App settings
      # page shows both, adjacent, and the deprecated one is the one that reads as
      # obvious — so the var is named for the Client ID on purpose.
      #
      # The two `permission-*` inputs scope the minted token BELOW the App's own
      # grant, so this job cannot use any extra permission the App is later given.
      # The App must be granted at least these two or the mint fails.
      #
      # DELIBERATELY NO `continue-on-error`. If the var is set but the mint fails
      # (bad or rotated private key, App uninstalled, permission revoked) this job
      # FAILS rather than falling back. That is the safer outcome, not the lazier
      # one: falling back to GITHUB_TOKEN would enqueue a PR that the queue never
      # builds, and that entry then blocks the head of an ALLGREEN queue for the
      # full 60-minute timeout — actively worse for every other stream than not
      # enqueuing at all. A red run on a configured-and-broken App is the signal
      # you want. The graceful path below exists only for the NOT-YET-CONFIGURED
      # case, where GITHUB_TOKEN is the long-standing status quo.
      # -----------------------------------------------------------------------
      - name: Mint a GitHub App token
        id: app-token
        if: vars.DEPENDABOT_AUTOMERGE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPENDABOT_AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Re-assert auto-merge so the PR enters the merge queue
        env:
          # Preference order, and why each link exists:
          #   1. App installation token — the intended path. Triggers workflows,
          #      no expiry to manage, not tied to a person's account.
          #   2. DEPENDABOT_AUTOMERGE_PAT — the owner's escape hatch if the App is
          #      ever uninstalled or its key rotated badly. Kept deliberately; it
          #      is not a migration leftover.
          #   3. GITHUB_TOKEN — works for every API call this job makes, but the
          #      resulting enqueue will NOT trigger merge_group checks. That is a
          #      SILENT degradation, which is why the step below names the
          #      identity it is running as and warns when it lands here. Only
          #      reachable when NOTHING is configured: a configured-but-broken App
          #      fails the mint step above instead of arriving here.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.DEPENDABOT_AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
          # Identity is derived from the mint step's own output rather than probed
          # via the API: an installation token cannot call `GET /user` (it answers
          # "Resource not accessible by integration"), and GITHUB_TOKEN is itself
          # an installation token, so a `gh api user` probe would fail for exactly
          # the two cases it is meant to distinguish.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HAS_PAT: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT != '' }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail

          # --- Report which identity we are acting as -------------------------
          # The `||` chain above degrades silently by design, so say out loud
          # which link it landed on. This is the difference between "the stall is
          # back and nobody knows why" and a yellow annotation on the run that
          # names the cause. A warning rather than a failure because the only way
          # to reach the GITHUB_TOKEN link is that nothing is configured yet —
          # the months-long status quo — and failing here would turn every
          # Dependabot CI completion red over a gap only the owner can close.
          # A configured-but-broken App never reaches this line: see the mint step.
          if [[ -n "${APP_SLUG:-}" ]]; then
            echo "Acting as ${APP_SLUG}[bot] (GitHub App installation token) — enqueues WILL trigger merge_group checks."
          elif [[ "${HAS_PAT:-false}" == "true" ]]; then
            echo "Acting as DEPENDABOT_AUTOMERGE_PAT (fallback) — enqueues will trigger merge_group checks."
          else
            echo "::warning::Acting as GITHUB_TOKEN — this enqueue will NOT trigger merge_group checks, so the PR will enter the queue and stall at its head until dropped at the 60-minute timeout. Configure the GitHub App: see plans/todo/dependabot-automerge-pat.md."
          fi

          # --- Resolve the PR -------------------------------------------------
          # For workflow_run, resolve from the head SHA rather than
          # workflow_run.pull_requests — the latter is empty often enough that it
          # cannot be relied on.
          if [[ -n "${DISPATCH_PR:-}" ]]; then
            PR="$DISPATCH_PR"
            echo "Manual dispatch for PR #$PR"
          else
            PR="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                    --jq '[.[] | select(.state == "open")] | first | .number // empty')"
            if [[ -z "$PR" ]]; then
              echo "No open PR for $HEAD_SHA — nothing to do."
              exit 0
            fi
            echo "Resolved $HEAD_SHA -> PR #$PR"
          fi

          # --- Guards ---------------------------------------------------------
          # GraphQL, not `gh pr view --json`: isInMergeQueue is not exposed by the
          # REST-backed field set.
          PR_QUERY='query($owner:String!,$repo:String!,$pr:Int!){
            repository(owner:$owner,name:$repo){
              pullRequest(number:$pr){
                state author{login} autoMergeRequest{mergeMethod}
                isInMergeQueue mergeStateStatus
              }
            }
          }'

          read -r STATE AUTHOR HAS_AUTO IN_QUEUE _MERGE_STATE <<<"$(
            gh api graphql -f query="$PR_QUERY" \
              -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$PR" \
              --jq '.data.repository.pullRequest
                    | [.state, .author.login, (.autoMergeRequest != null),
                       .isInMergeQueue, .mergeStateStatus] | @tsv'
          )"

          if [[ -z "${STATE:-}" ]]; then
            echo "Could not read PR #$PR metadata — refusing to act."; exit 1
          fi
          if [[ "$STATE" != "OPEN" ]]; then
            echo "PR #$PR is $STATE — nothing to do."; exit 0
          fi
          # Enforced on the dispatch path too, or this becomes a generic
          # "merge anything" lever. GraphQL reports the bot as "dependabot";
          # the other spellings are accepted defensively.
          case "$AUTHOR" in
            dependabot|dependabot'[bot]'|app/dependabot) ;;
            *) echo "PR #$PR author is '$AUTHOR', not Dependabot — refusing."; exit 0 ;;
          esac
          # No auto-merge request == the policy job did not approve this PR
          # (or it is not a minor/patch bump). Do not merge it.
          if [[ "$HAS_AUTO" != "true" ]]; then
            echo "PR #$PR has no auto-merge request — policy did not approve it."; exit 0
          fi
          if [[ "$IN_QUEUE" == "true" ]]; then
            echo "PR #$PR is already in the merge queue — leaving it alone."; exit 0
          fi

          # --- Wait for mergeability to settle --------------------------------
          # workflow_run fires the instant CI completes; GitHub recomputes
          # mergeStateStatus asynchronously, so a brief BLOCKED/UNKNOWN read here
          # is expected and not an error.
          MERGE_STATE=""
          for attempt in 1 2 3; do
            MERGE_STATE="$(gh pr view "$PR" --repo "$REPO" \
                             --json mergeStateStatus --jq .mergeStateStatus)"
            if [[ "$MERGE_STATE" == "CLEAN" ]]; then break; fi
            echo "Attempt $attempt: mergeStateStatus=$MERGE_STATE — waiting..."
            sleep 15
          done

          if [[ "$MERGE_STATE" != "CLEAN" ]]; then
            echo "PR #$PR is $MERGE_STATE, not CLEAN — exiting without action."
            echo "Another CI completion will re-run this job."
            exit 0
          fi

          # --- Re-assert ------------------------------------------------------
          # Re-issuing --auto alone is a no-op on an already-enabled PR; the
          # disable/enable pair is what creates a fresh, evaluated request.
          echo "PR #$PR is CLEAN but not queued — re-asserting auto-merge."
          gh pr merge "$PR" --repo "$REPO" --disable-auto
          sleep 3
          gh pr merge "$PR" --repo "$REPO" --auto
          sleep 10

          # GraphQL again here — `gh pr view --json isInMergeQueue` does not exist
          # and would fail the job under `set -e` *after* a successful enqueue.
          QUEUED="$(
            gh api graphql -f query="$PR_QUERY" \
              -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$PR" \
              --jq '.data.repository.pullRequest.isInMergeQueue'
          )"
          echo "PR #$PR isInMergeQueue=$QUEUED"
          if [[ "$QUEUED" != "true" ]]; then
            echo "::warning::PR #$PR was CLEAN but did not enter the merge queue."
          fi
