name: Mobile build

# Builds the @pegasus/mobile EAS artifact (preview or production) against
# the selected Pegasus environment.
#
# Runtime config is resolved from SSM at build time — the four parameters
# that pin api.* + Cognito are written to apps/mobile/.env and then
# `eas build` is invoked. This is the durable answer to Part 3 of
# plans/in-progress/mobile-cognito-config.md (SSM-direct-read, locked
# 2026-05-28 over the artifact-download approach to avoid the 14-day
# retention dependency).
#
# Prereqs:
#   - GitHub environment `staging` / `prod` with `AWS_DEPLOY_ROLE_ARN`
#     pointing at the Pegasus deploy OIDC role for that account. The
#     role must have `ssm:GetParameter` on:
#       /pegasus/admin/cognito-user-pool-id
#       /pegasus/mobile/cognito-client-id
#       /pegasus/admin/cognito-hosted-ui-domain
#       /dolas/pegasus/api/domain-name
#   - Repo secret `EXPO_TOKEN` for `eas build --non-interactive`.
#
# Trigger: manual dispatch only — there is no path filter for mobile in
# the deploy pipeline yet (out of scope, noted in the plan).

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target Pegasus environment'
        type: choice
        required: true
        default: staging
        options:
          - staging
          - prod
      platform:
        description: 'EAS build platform'
        type: choice
        required: true
        default: all
        options:
          - all
          - android
          - ios

concurrency:
  group: mobile-build-${{ github.event.inputs.env }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build mobile (${{ github.event.inputs.env }} / ${{ github.event.inputs.platform }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fix binary permissions
        run: find node_modules/.bin -type f | xargs chmod +x 2>/dev/null || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: pegasus-mobile-build-${{ github.event.inputs.env }}-${{ github.run_id }}

      - name: Resolve mobile config from SSM
        id: ssm
        run: |
          set -euo pipefail
          USER_POOL_ID=$(aws ssm get-parameter --name /pegasus/admin/cognito-user-pool-id --query Parameter.Value --output text)
          CLIENT_ID=$(aws ssm get-parameter --name /pegasus/mobile/cognito-client-id --query Parameter.Value --output text)
          HOSTED_UI=$(aws ssm get-parameter --name /pegasus/admin/cognito-hosted-ui-domain --query Parameter.Value --output text)
          API_DOMAIN=$(aws ssm get-parameter --name /dolas/pegasus/api/domain-name --query Parameter.Value --output text)
          # User pool + client IDs aren't strict secrets (they're embedded in
          # any built mobile app) but masking them keeps the job log tidy.
          echo "::add-mask::$USER_POOL_ID"
          echo "::add-mask::$CLIENT_ID"
          {
            echo "USER_POOL_ID=$USER_POOL_ID"
            echo "CLIENT_ID=$CLIENT_ID"
            echo "HOSTED_UI=$HOSTED_UI"
            echo "API_DOMAIN=$API_DOMAIN"
          } >> "$GITHUB_OUTPUT"

      - name: Write apps/mobile/.env
        run: |
          set -euo pipefail
          cat > apps/mobile/.env <<ENVEOF
          # Generated by mobile-build.yml — do not commit
          EXPO_PUBLIC_API_URL=https://${{ steps.ssm.outputs.API_DOMAIN }}
          EXPO_PUBLIC_COGNITO_REGION=us-east-1
          EXPO_PUBLIC_COGNITO_USER_POOL_ID=${{ steps.ssm.outputs.USER_POOL_ID }}
          EXPO_PUBLIC_COGNITO_CLIENT_ID=${{ steps.ssm.outputs.CLIENT_ID }}
          EXPO_PUBLIC_COGNITO_DOMAIN=${{ steps.ssm.outputs.HOSTED_UI }}
          EXPO_PUBLIC_COGNITO_REDIRECT_URI=movingapp://auth/callback
          ENVEOF
          # Show non-secret lines for the run log so the resolved API URL is
          # visible at a glance — sensitive values are already masked above.
          echo "Wrote apps/mobile/.env:"
          grep -E '^EXPO_PUBLIC_(API_URL|COGNITO_REGION|COGNITO_REDIRECT_URI)=' apps/mobile/.env

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.env }}" == "prod" ]]; then
            profile="production"
          else
            profile="preview"
          fi
          eas build --non-interactive --profile "$profile" --platform ${{ github.event.inputs.platform }}
