# Source registry — the index of every source considered for the domain reference model.
#
# Schema (per entry):
#   id          kebab-case, stable; cite as src:<id>
#   name, publisher
#   kind        reference-model | message-standard | vendor-api | regulation | tariff |
#               ontology | internal-system | glossary | contract | reference-data | dataset
#   openness    public | free-registration | gated-partner | paid | licensed | internal
#   license     as stated by the publisher, or "unstated"
#   areas       rubric area ids (A1–A13) the source informs
#   priority    P1 analyze in detail · P2 useful / comparator · P3 record only
#   status      candidate   known, not yet captured
#               captured    material stored under sources/<id>/ or referenced in-repo
#               needs-user  requires the user to obtain it (see `obtain`) → drop in inbox/
#               obtained    user-provided material processed into sources/<id>/
#               analyzed    sources/<id>/analysis.md exists
#               skipped     recorded for completeness; not worth analysis
#   urls        where it lives publicly (verified 2026-09-11 unless `notes` says otherwise)
#   refs        in-repo or cross-repo paths (pegasus-workflows = ~/repos/pegasus-workflows)
#   files       stored copies: {path, sha256, retrieved, from}; local/ paths are gitignored
#   obtain      what a human must do to get gated/licensed/bot-blocked material
#   notes       anything that changes how the source should be read
#
# Discovery performed 2026-09-11 (four research passes: internal, HHG/relocation,
# logistics standards, visibility/telematics).
#
# Tenant reality, confirmed by the user 2026-09-17 — this sets priority:
#   * Van lines: tenants are agents for ALLIED (SIRVA) and ATLAS. Both already held
#     (src:sirva-ade, src:atlas-world-group-api). Other van lines dropped to P3.
#   * Telematics: OMNITRACS and SAMSARA. Both P1. Platform Science / Transflo /
#     ORBCOMM keep value only as comparators.
#   * Shippers require NO EDI and NO visibility platform today, but the model must be
#     ready for both — so X12 and project44 stay in as vocabulary sources (P2),
#     not as integration targets.
# Inbox drop processed 2026-09-17: UN/CEFACT RDM package, NMFTA eBOL specs,
# an X12 858 implementation guide, and further leads (GTFS, Alvys, EDI walkthroughs).

sources:

