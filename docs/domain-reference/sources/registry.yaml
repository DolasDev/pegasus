    User lead. Not freight, but the most widely deployed public model of *planned vs
    actual movement along an ordered sequence of stops*: stop_times (scheduled),
    TripUpdate / StopTimeUpdate (delay, predicted arrival/departure, schedule
    relationship SCHEDULED/SKIPPED/CANCELED/ADDED), VehiclePosition (the telemetry
    boundary), and Alerts. Read for A3/A4 structure — stop sequence, prediction vs
    actual, and how it keeps a plan and its execution in one model.

