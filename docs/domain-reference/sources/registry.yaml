- id: x12-212-trailer-manifest
  name: X12 004010 TS 212 — Motor Carrier Delivery Trailer Manifest
  publisher: X12 (read via stedi.com, non-normative)
  role: model-evidence
  kind: message-standard
  openness: public
  license: unstated (Stedi reference); X12 definitions themselves are licensed
  areas: [A2, A3, A6, A7, A9]
  priority: P1
  status: analyzed
  urls: ["https://www.stedi.com/edi/x12-004010/212"]
  notes: >
    Read because it is the one standard whose whole premise is MANY SHIPMENTS ON ONE VEHICLE —
    the consolidation question no round-1 source could express. Verdict: it half-answers A3.
    Consolidation IS first-class (loop 0200 repeats 9999 shipments under one MS2 equipment, TSD
    gives loading sequence and physical position on the trailer, AT9 the trailer envelope and
    tare, BLR a PER-SHIPMENT carrier SCAC so one trailer can carry interline freight) — but
    stops, stop sequence, legs and driver are entirely ABSENT (no S5, no S5A/S5B, no N7 in the
    whole set). So it is a LOAD PLAN, not a trip, and consolidation is expressed by re-issuing
    documents rather than by a persistent trip entity. Strong on A9 identity (manifest number,
    delivering SCAC, owner SCAC + equipment number + check digit, per-shipment SCAC with an
    effective date).

