# Local-dev Temporal stack for the Pegasus workflows developer flow.
#
# This is a LOCAL-DEV AID ONLY. It is invoked by `pegasus-workflows test`
# (see packages/workflows-sdk-python) so workflow authors can run their
# workflows against a real Temporal server before publishing.
#
# Phase 2 Unit 5 added the `temporal-worker` service so the curated stdlib
# worker can be run locally against the same Temporal dev server. Phase 3
# Unit 8 added `tenant-runner` (sandboxed tenant-code runner). All services
# are OPT-IN — start what you need:
#
#   # SDK-only flow (Phase 1 behaviour, unchanged):
#   docker compose -f docker-compose.temporal.yml up temporal
#
#   # Curated-worker flow (Phase 2 Unit 5 onwards):
#   docker compose -f docker-compose.temporal.yml up temporal temporal-worker
#
#   # Tenant-runner flow (Phase 3 Unit 8 — needs a real tenant id + wbk_
#   # token; see apps/tenant-runner/README.md "Local development"):
#   PEGASUS_TENANT_ID=<uuid> PEGASUS_TENANT_BROKER_TOKEN=<wbk_...> \
#     docker compose -f docker-compose.temporal.yml up temporal tenant-runner
#
# Stop:
#   docker compose -f docker-compose.temporal.yml down
#
# Ports:
#   7233  Temporal frontend gRPC (the SDK and worker both connect here)
#   8080  Temporal Web UI  ->  http://localhost:8080

name: pegasus-temporal-dev

services:
  # Single-binary Temporal dev server with an in-memory database. No
  # persistence between restarts — exactly what local workflow testing needs.
  # The temporalio/temporal image's entrypoint is the `temporal` CLI itself,
  # so the command is just its arguments.
  temporal:
    image: temporalio/temporal:1.4.1
    container_name: pegasus-temporal
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--ui-port', '8080']
    ports:
      - '7233:7233'
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 20

  # Pegasus Temporal worker — Phase 2 Unit 5. Connects to the local
  # `temporal` service (no TLS, no auth — the empty TEMPORAL_CLOUD_API_KEY
  # flips the worker into "local Temporal dev server" mode; see
  # apps/temporal-worker/pegasus_temporal_worker/config.py and worker.py).
  #
  # PEGASUS_API_BASE_URL points at host.docker.internal so an `apps/api` you
  # run locally (with `npm run dev`) is reachable from inside the container.
  # On Linux you may need to expose host.docker.internal manually — most
  # recent Docker Desktop / Docker Engine setups handle this transparently.
  #
  # WORKFLOW_BROKER_SECRET is a non-empty sentinel so the worker's broker
  # client doesn't fail-fast at startup. Until Unit 6 lands, broker calls
  # will 404; the worker handles that explicitly (see runtime_client.py).
  temporal-worker:
    build:
      # Repo root — matches the Dockerfile's expectation. CI invokes
      # `docker build -f apps/temporal-worker/Dockerfile .` from the same
      # context.
      context: .
      dockerfile: apps/temporal-worker/Dockerfile
    container_name: pegasus-temporal-worker
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: 'temporal:7233'
      # Local Temporal dev server only ships the `default` namespace.
      TEMPORAL_NAMESPACE: 'default'
      TEMPORAL_TASK_QUEUE: 'pegasus-stdlib-dev'
      PEGASUS_API_BASE_URL: 'http://host.docker.internal:3000'
      ENV_NAME: 'dev'
      # Empty -> worker connects without auth + TLS (local Temporal mode).
      TEMPORAL_CLOUD_API_KEY: ''
      # Non-empty placeholder so config.py doesn't fail-fast; broker calls
      # will 404 against any non-Unit-6 API and that's expected.
      WORKFLOW_BROKER_SECRET: 'local-dev-only'
    # Linux dev hosts: this maps host.docker.internal to the host's IP so
    # the worker can reach `npm run dev`'s API on :3000. Docker Desktop
    # (macOS, Windows) does this automatically; the explicit mapping is
    # a no-op there.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Pegasus tenant runner — Phase 3 Unit 8. The trusted shim that downloads
  # the tenant's executable artifacts (via the local API's broker endpoint),
  # sha256-verifies them, and runs tenant code in stripped-env subprocesses.
  #
  # Unlike the stdlib worker this service NEEDS real per-tenant inputs to do
  # anything: a tenant id and that tenant's wbk_ broker token (mint it with
  # the tsx one-liner in apps/tenant-runner/README.md). Without them the
  # container exits 2 (config error) with a friendly message — the defaults
  # below are well-formed placeholders so `docker compose config` validates.
  #
  # Note the runner is scale-to-zero by design: it exits 0 after 10 idle
  # minutes (RUNNER_IDLE_TIMEOUT_SECONDS to tune) — `up` it again as needed.
  tenant-runner:
    build:
      # Repo root context — the Dockerfile reaches into
      # packages/workflows-sdk-python/ (see its header).
      context: .
      dockerfile: apps/tenant-runner/Dockerfile
    container_name: pegasus-tenant-runner
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: 'temporal:7233'
      # Local Temporal dev server only ships the `default` namespace.
      TEMPORAL_NAMESPACE: 'default'
      PEGASUS_API_BASE_URL: 'http://host.docker.internal:3000'
      ENV_NAME: 'dev'
      # Empty -> runner connects without auth + TLS (local Temporal mode).
      TEMPORAL_CLOUD_API_KEY: ''
      # REQUIRED real values — export these before `up` (placeholders parse
      # but the broker will 401 them):
      TENANT_ID: '${PEGASUS_TENANT_ID:-00000000-0000-4000-8000-000000000000}'
      WORKFLOW_BROKER_TOKEN: '${PEGASUS_TENANT_BROKER_TOKEN:-wbk_00000000-0000-4000-8000-000000000000_000000000000000000000000000000000000000000000000}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
