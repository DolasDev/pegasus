[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "__WORKFLOW_NAME__"
version = "0.1.0"
description = "A Pegasus workflow project."
requires-python = ">=3.11"
dependencies = ["pegasus-workflows-sdk>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["__WORKFLOW_NAME__"]
