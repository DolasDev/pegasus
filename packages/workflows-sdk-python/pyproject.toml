[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pegasus-workflows-sdk"
version = "0.1.0"
description = "Python SDK and CLI for authoring, packaging, and publishing Pegasus workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "DolasDev" }]
keywords = ["pegasus", "workflows", "temporal", "automation"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "temporalio>=1.7",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pegasus-workflows = "pegasus_workflows.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pegasus_workflows"]

[tool.hatch.build.targets.wheel.force-include]
"pegasus_workflows/templates" = "pegasus_workflows/templates"

[tool.hatch.build.targets.sdist]
include = ["pegasus_workflows", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: Typer's documented API *is* a function call in an argument default.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
