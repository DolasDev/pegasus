[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pegasus-workflows-sdk"
version = "0.29.0"
description = "Python SDK and CLI for authoring, packaging, and publishing Pegasus workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "DolasDev" }]
keywords = ["pegasus", "workflows", "temporal", "automation"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# Upper bounds: this SDK is consumed by tenants, and the platform controls the
# supported matrix — a silent temporalio 2.x / httpx 1.x at install time is a real
# breakage vector. Bump caps deliberately via Dependabot pip PRs.
dependencies = [
  "temporalio>=1.7,<2",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  # The MCP authoring server (`pegasus-workflows mcp`) ships in the BASE package
  # so a plain `pip install pegasus-workflows-sdk` yields a working server — the
  # onboarding path `setup` advertises (it registers the server in .mcp.json).
  # Keeping it optional regressed that: a clean install registered a server that
  # couldn't start (sdk-feedback 0012). The `[mcp]` extra below is a no-op alias
  # kept only so existing `…[mcp]` install commands still resolve.
  "mcp>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
# Back-compat no-op: `mcp` is now a base dependency (see above). This alias keeps
# `pip install 'pegasus-workflows-sdk[mcp]'` valid; it installs nothing extra.
mcp = []

[project.scripts]
pegasus-workflows = "pegasus_workflows.cli:main"

[tool.hatch.build.targets.wheel]
# `packages = [...]` already pulls every file under pegasus_workflows/ into
# the wheel, including the non-Python `templates/` data dir used by the
# `pegasus-workflows init` CLI scaffold. A previous `[...wheel.force-include]`
# block tried to re-add `pegasus_workflows/templates` at the same path and
# broke the wheel build with "A second file is being added at the same
# path: pegasus_workflows/templates/README.md". Phase 1 only used `pip
# install -e` (editable) so the bug went unnoticed until the Phase 2
# Unit 5 Dockerfile did a real `pip install` against the SDK.
packages = ["pegasus_workflows"]

[tool.hatch.build.targets.sdist]
include = ["pegasus_workflows", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: Typer's documented API *is* a function call in an argument default.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
